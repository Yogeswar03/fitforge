<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0D17" />
      <stop offset="50%" stopColor="#121728" />
      <stop offset="100%" stopColor="#060810" />
    </linearGradient>

    <!-- Outer Rim Neon Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00E676" />
      <stop offset="50%" stopColor="#00B0FF" />
      <stop offset="100%" stopColor="#7C4DFF" />
    </linearGradient>

    <!-- Primary Emerald-Cyan Blade Gradient -->
    <linearGradient id="primaryBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00FF87" />
      <stop offset="100%" stopColor="#60EFFF" />
    </linearGradient>

    <!-- Secondary Cyan-Violet Blade Gradient -->
    <linearGradient id="secondaryBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00B0FF" />
      <stop offset="100%" stopColor="#651FFF" />
    </linearGradient>

    <!-- Forge Fire Core Gradient -->
    <linearGradient id="forgeFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#FF1744" />
      <stop offset="50%" stopColor="#FF9100" />
      <stop offset="100%" stopColor="#FFEA00" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#00E676" stopOpacity="0.45" />
      <stop offset="60%" stopColor="#00B0FF" stopOpacity="0.15" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Filter for Neon Drop Shadow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="64" cy="64" r="42" fill="url(#coreGlow)" />

  <!-- Diagonal Tech Accent Lines -->
  <line x1="16" y1="36" x2="36" y2="16" stroke="white" stroke-opacity="0.04" stroke-width="2" />
  <line x1="92" y1="112" x2="112" y2="92" stroke="white" stroke-opacity="0.04" stroke-width="2" />

  <!-- ============================================================== -->
  <!-- FITFORGE EMBLEM: Interlocking Forged Dumbbell & Flame Blades -->
  <!-- ============================================================== -->

  <!-- Left Barbell / "F" Wing Plate -->
  <path d="M 28 38 L 46 26 L 46 44 L 38 50 L 38 78 L 46 84 L 46 102 L 28 90 Z" 
        fill="url(#primaryBlade)" 
        filter="url(#neonGlow)" />

  <!-- Right Barbell / "F" Wing Plate -->
  <path d="M 100 38 L 82 26 L 82 44 L 90 50 L 90 78 L 82 84 L 82 102 L 100 90 Z" 
        fill="url(#secondaryBlade)" 
        filter="url(#neonGlow)" />

  <!-- Central Heavy Barbell Shaft -->
  <rect x="42" y="60" width="44" height="8" rx="2" fill="#E2E8F0" />
  <rect x="48" y="58" width="3" height="12" rx="1" fill="#94A3B8" />
  <rect x="77" y="58" width="3" height="12" rx="1" fill="#94A3B8" />

  <!-- Center Forged Core: Athletic Hexagonal Shield & Forge Flame -->
  <!-- Hexagon Outer Shell -->
  <polygon points="64,32 78,41 78,87 64,96 50,87 50,41" 
           fill="#0B0E17" 
           stroke="url(#primaryBlade)" 
           stroke-width="2.5" />

  <!-- Inner Forge Flame (Power & Transformation) -->
  <path d="M 64 42 Q 72 54 70 66 Q 69 76 64 86 Q 59 76 58 66 Q 56 54 64 42 Z" 
        fill="url(#forgeFlame)" 
        filter="url(#neonGlow)" />

  <!-- Diamond Spark Highlight -->
  <polygon points="64,54 67,64 64,74 61,64" fill="#FFFFFF" opacity="0.9" />

  <!-- Subtle Top Gloss Arc -->
  <path d="M 14 36 Q 64 8 114 36" stroke="white" stroke-width="1.5" stroke-opacity="0.15" fill="none" stroke-linecap="round" />
</svg>
